name: Profitability invariants
on:
  pull_request:
    paths:
      - 'modules/**'
      - 'signal_scanner.py'
      - 'profitability_config.json'
      - 'run_profitability_report.py'
      - 'tests/test_profitability.py'
      - 'research/*.py'
      - '.github/workflows/profitability-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'signal_scanner.py'
      - 'profitability_config.json'
      - 'tests/test_profitability.py'
      - 'research/*.py'
      - '.github/workflows/profitability-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B -m unittest discover -s tests -p test_profitability.py -v
      - run: python -B test_spread_monitor.py
      - run: python -B test_entry_validator.py
      - run: python -B research/test_initial_stop.py
      - run: python -B research/test_regime_filter.py
      - run: python -B research/verify_regime_filter_result.py
